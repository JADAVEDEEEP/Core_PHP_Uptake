<html>
	<head>
		<title>Tag Demo</title>
	</head>
	<body style="background-color:skyblue;font-family:cursive;">
		<form>
			<table align="center" width="500" height="700">
				<tr>
					<td colspan="2" align="center"><h1>Demonstration Of HTML Tags</h1></td>
					<td></td>
				</tr>
				<tr>
					<td><label for="decimalno">Enter A Decimal Number:</label></td>
					<td><input type="number" min="1" max="10" step="0.5"></td>
				</tr>
				<tr>
					<td><label for="intno">Enter AN Integer Number:</label></td>
					<td><input type="number" min="1" max="10"></td>	
				</tr>
				<tr>
					<td><label for="intrate">Rate Out Of 1-5:</label></td>
					<td><input type="range" min="1" max="5"></td>	
				</tr>
				<tr>
					<td><label for="decimalrate">Rate Out Of 1-5(In Decimal):</label></td>
					<td><input type="range" min="1" max="10" step="0.5"></td>
				</tr>
				<tr>
					<td><label for="favcolor">Select Your Favorite Colour:</label></td>
					<td><input type="color"></td>
				</tr>
				<tr>
					<td><label for="bdaymon">Select Your Birthday Month:</label></td>
					<td><input type="month"></td>
				</tr>
				<tr>
					<td><label for="email">Enter Your E-Mail:</label></td>
					<td><input type="email"></td>
				</tr>
				<tr>
					<td><label for="website">Enter Your Website:</label></td>
					<td><input type="url"></td>
				</tr>
				<tr>
					<td><label for="bdate">Select Your Birth Date:</label></td>
					<td><input type="date"></td>
				</tr>
				<tr>
					<td><label for="search">Search Anything Here:</label></td>
					<td><input type="search"></td>
				</tr>
				<tr>
					<td><label for="time">Enter Time Of Registration:</label></td>
					<td><input type="time"></td>
				</tr>
				<tr>
					<td><label for="holidayw">Enter Your Holiday Week:</label></td>
					<td><input type="week"></td>
				</tr>
				<tr>
					<td><label for="nobileno">Enter Your Mobile Number:</label></td>
					<td><input type="tel" placeholder="**-****-****"></td>
				</tr>
				<tr>
					<td><label for="datetime">Enter Date And Time Of Registration:</label></td>
					<td><input type="datetime-local" ></td>
				</tr>
			</table>
		</form>
	</body>
</html>
